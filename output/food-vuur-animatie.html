<style>
#fv-preview {width:100%;font-family:Arial,sans-serif}
#fv-preview .fv-controls {display:flex;justify-content:flex-start;margin-bottom:12px}
#fv-preview button {background:#24211e;color:#fff4e5;border:1px solid #815031;padding:10px 16px;border-radius:5px;font:inherit;cursor:pointer}
#fv-preview button:focus-visible {outline:3px solid #f47829;outline-offset:3px}
#fv-preview .fv-scene {position:relative;overflow:hidden;background:#100f0c}
#fv-preview img {display:block;width:100%;height:auto}
#fv-preview canvas {position:absolute;left:0;top:11.2%;width:100%;height:43.5%;pointer-events:none}
</style>
<script>
(() => {
 const root=document.getElementById('fv-preview');
 const canvas=root.querySelector('canvas'), ctx=canvas.getContext('2d');
 const button=root.querySelector('button');
 const reduced=matchMedia('(prefers-reduced-motion: reduce)');
 let playing=!reduced.matches,time=0,previous=0;
 const photo=root.querySelector('img');
 const heat=document.createElement('canvas');heat.width=1084;heat.height=632;
 const hx=heat.getContext('2d');let heatReady=false;
 function buildHeat(){
  hx.drawImage(photo,0,photo.naturalHeight*.112,photo.naturalWidth,photo.naturalHeight*.435,0,0,1084,632);
  const pixels=hx.getImageData(0,0,1084,632),d=pixels.data;
  for(let y=0;y<632;y++)for(let x=0;x<1084;x++){
   const k=(y*1084+x)*4,r=d[k],g=d[k+1],b=d[k+2];
   const inside=y>338 && y<492 && x>55 && x<1040;
   const a=inside?Math.max(0,Math.min(1,(r-g-28)/65))*Math.min(1,r/160):0;
   d[k]=255;d[k+1]=105+g*.35;d[k+2]=12;d[k+3]=a*210;
  }
  hx.putImageData(pixels,0,0);heatReady=true;
 }
 if(photo.complete && photo.naturalWidth)buildHeat();else photo.addEventListener('load',buildHeat,{once:true});
 const smokeStreams=[{x:.247,phase:0},{x:.57,phase:1.8},{x:.752,phase:3.4}];
 function drawSmoke(w,h){
  ctx.save();
  ctx.globalCompositeOperation='source-over';
  const scale=Math.min(w/760,2);
  for(const {x,phase} of smokeStreams){
   const bottom=h*(.70+Math.sin(phase)*.016);
   const height=h*(.25+.024*Math.cos(time*.55+phase));
   const tone=ctx.createLinearGradient(0,bottom,0,bottom-height);
   tone.addColorStop(0,'rgba(207,186,168,0)');
   tone.addColorStop(.25,'rgba(224,217,211,.49)');
   tone.addColorStop(.57,'rgba(215,219,221,.54)');
   tone.addColorStop(1,'rgba(206,213,217,0)');
   for(let strand=0;strand<4;strand++){
    ctx.globalAlpha=(strand===0?.55:.43)*(.82+.18*Math.sin(time*1.05+phase+strand));
    ctx.strokeStyle=tone;
    ctx.lineWidth=Math.max(1,scale*[26,13,8,4][strand]);
    ctx.filter=`blur(${Math.max(.7,scale*[10,5,3.4,1.8][strand])}px)`;
    ctx.beginPath();
    for(let step=0;step<=32;step++){
     const p=step/32;
     const curl=Math.sin(p*10-time*1.35+phase+strand*.48)*p*.032;
     const spread=Math.sin(p*18-time*.92+phase*2+strand)*p*.011;
     const px=w*(x+p*.046+curl+spread+(strand-1.5)*p*.008);
     const py=bottom-p*height;
     if(step===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.stroke();
   }
  }
  ctx.restore();
 }
 function resize(){const r=canvas.getBoundingClientRect();canvas.width=Math.round(r.width*devicePixelRatio);canvas.height=Math.round(r.height*devicePixelRatio)}
 new ResizeObserver(resize).observe(canvas);
 function render(){
  const w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);
  ctx.globalCompositeOperation='screen';
  const pulse=.48+.24*Math.sin(time*2.3)+.14*Math.sin(time*5.1+.8);
  if(heatReady){
   ctx.globalAlpha=pulse;ctx.drawImage(heat,0,0,w,h);
   ctx.globalAlpha=pulse*.7;ctx.filter='blur(9px)';ctx.drawImage(heat,0,0,w,h);ctx.filter='none';
  }
  for(let i=0;i<6;i++){
   const x=w*(.17+i*.135),y=h*(.65+Math.sin(i*2)*.05);
   const radius=w*.075,glow=ctx.createRadialGradient(x,y,0,x,y,radius);
   glow.addColorStop(0,'rgba(255,88,8,.34)');glow.addColorStop(1,'rgba(255,60,0,0)');
   ctx.globalAlpha=.4+.3*Math.sin(time*(1.7+i*.15)+i);
   ctx.save();ctx.translate(x,y);ctx.scale(1,.43);ctx.translate(-x,-y);
   ctx.fillStyle=glow;ctx.fillRect(x-radius,y-radius,radius*2,radius*2);ctx.restore();
  }
  drawSmoke(w,h);
  for(let i=0;i<52;i++){
   const p=(time/(2.8+(i%9)*.31)+i*.618034)%1;
   const start=.12+((i*.381966)%1)*.76;
   const drift=Math.sin(p*6+i)*.018+p*.035;
   const x=w*(start+drift),y=h*(.73-(.28+(i%7)*.045)*p);
   ctx.globalAlpha=Math.min(1,p*9)*Math.pow(1-p,.65)*(.65+.3*Math.sin(i+time*5)**2);
   ctx.strokeStyle=i%4===0?'#ffe1a0':'#ff972f';ctx.fillStyle=ctx.strokeStyle;
   ctx.shadowColor='#ff640a';ctx.shadowBlur=7*devicePixelRatio;
   const r=Math.max(.7*devicePixelRatio,w*(.00065+(i%3)*.00035));
   ctx.lineWidth=r;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);
   ctx.lineTo(x-w*.0015,y+h*(.003+(i%4)*.0015));ctx.stroke();
   ctx.beginPath();ctx.arc(x,y,r*.6,0,Math.PI*2);ctx.fill();
  }
  ctx.shadowBlur=0;ctx.globalAlpha=1;
 }
 function sync(){button.textContent=playing?'Animatie pauzeren':'Animatie afspelen';button.setAttribute('aria-pressed',String(playing))}
 button.addEventListener('click',()=>{playing=!playing;sync()});
 reduced.addEventListener('change',()=>{playing=!reduced.matches;sync()});
 function frame(now){if(playing && previous)time+=Math.min((now-previous)/1000,.05);previous=now;render();requestAnimationFrame(frame)}
 sync();resize();requestAnimationFrame(frame);
})();
</script>
