 <text x="48" y="63" fill="#21473c" font-family="Georgia,serif" font-size="37" font-weight="bold">Badgepagina met twee mini-kaarten</text>
 <text x="50" y="94" fill="#63746a" font-family="Arial,sans-serif" font-size="17">Volledige voorbeeldopmaak · dezelfde papiertextuur, zachte groentinten en gele accenten</text>
