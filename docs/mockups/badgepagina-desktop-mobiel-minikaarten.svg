<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1510" viewBox="0 0 1700 1510" role="img" aria-labelledby="title desc">
 <title id="title">Badgepagina voorbeeld voor desktop en mobiel met twee mini-kaarten</title>
 <desc id="desc">Een ontwerp in de huidige papierstijl van Jouw Lichtpuntjes, met uitnodigingen om een momentje of verhaal te delen boven de badges.</desc>
 <defs>
  <filter id="shadow" x="-15%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#35513c" flood-opacity=".16"/></filter>
